<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f8fafc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="IPA Mis">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="IPA Mis">
    <meta name="msapplication-TileColor" content="#6366f1">
    <meta name="msapplication-navbutton-color" content="#6366f1">
    
    <title>IPA Mis - Phiên âm & Dịch từ</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="icons/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/logo.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/logo.png">
    <link rel="apple-touch-icon" sizes="144x144" href="icons/logo.png">
    <link rel="apple-touch-icon" sizes="120x120" href="icons/logo.png">
    <link rel="apple-touch-icon" sizes="114x114" href="icons/logo.png">
    <link rel="apple-touch-icon" sizes="76x76" href="icons/logo.png">
    <link rel="apple-touch-icon" sizes="72x72" href="icons/logo.png">
    <link rel="apple-touch-icon" href="icons/logo.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-gradient"></div>
    <div class="bg-pattern"></div>
    
    <div class="app-container">
        <!-- Header with Logo -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo">
                    <img src="icons/logo.png" alt="IPA Mis Logo" class="logo-image">
                    <div class="logo-text">
                        <h1>IPA Mis</h1>
                        <span class="tagline">Phiên âm & Dịch từ Chuyên nghiệp</span>
                    </div>
                </div>
            </div>
            <div class="header-decoration">
                <div class="floating-orb orb-1"></div>
                <div class="floating-orb orb-2"></div>
                <div class="floating-orb orb-3"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Card -->
            <section class="glass-card input-card">
                <div class="card-header">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </div>
                    <h2>Nhập từ vựng</h2>
                </div>
                
                <div class="input-wrapper">
                    <textarea 
                        id="wordInput" 
                        class="modern-textarea"
                        placeholder="Nhập từ vựng cần phân tích...&#10;Ví dụ:&#10;sheep&#10;meal&#10;marine"
                    ></textarea>
                    <div class="textarea-glow"></div>
                </div>
                
                <div class="input-hint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 16v-4"/>
                        <path d="M12 8h.01"/>
                    </svg>
                    <span>Mẹo: Nhập nhiều từ cùng lúc, mỗi từ một dòng</span>
                </div>

                <div class="action-buttons">
                    <button class="btn-modern btn-primary" onclick="processWords()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        <span>Phân tích</span>
                        <div class="btn-shine"></div>
                    </button>
                    <button class="btn-modern btn-secondary" onclick="clearResults()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18"/>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        </svg>
                        <span>Xóa</span>
                    </button>
                </div>
            </section>

            <!-- Loading State -->
            <div id="loadingIndicator" class="loading-container" style="display: none;">
                <div class="loading-spinner">
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                </div>
                <p class="loading-text">Đang phân tích từ vựng...</p>
            </div>

            <!-- Results Section -->
            <section class="results-section" id="resultsSection">
                <div class="empty-state glass-card">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                            <path d="M8 7h8"/>
                            <path d="M8 11h6"/>
                        </svg>
                    </div>
                    <h3>Chưa có kết quả</h3>
                    <p>Nhập từ vựng và nhấn "Phân tích" để bắt đầu</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>© 2025 IPA Master • Phiên âm IPA chuẩn xác</p>
        </footer>
    </div>

    <!-- Install PWA Button -->
    <button id="installBtn" class="install-btn" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Cài đặt ứng dụng</span>
    </button>

    <!-- Back to Top Button -->
    <button id="backToTopBtn" class="back-to-top-btn" aria-label="Lên đầu trang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"/>
        </svg>
    </button>

    <script src="script.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
        });

        // Back to Top Button
        const backToTopBtn = document.getElementById('backToTopBtn');
        
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
