<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #fff; }
        .icon-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .icon-item { text-align: center; }
        canvas { border: 1px solid #444; border-radius: 8px; }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            background: linear-gradient(135deg, #6366f1, #8b5cf6); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            margin: 10px 5px;
        }
        button:hover { opacity: 0.9; }
        h1 { color: #6366f1; }
        a { color: #8b5cf6; }
    </style>
</head>
<body>
    <h1>🎨 PWA Icon Generator</h1>
    <p>Click vào từng nút để download icon với size tương ứng:</p>
    
    <div id="buttons"></div>
    
    <div class="icon-grid" id="iconGrid"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const buttonsContainer = document.getElementById('buttons');
        const iconGrid = document.getElementById('iconGrid');

        // SVG content
        const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
                <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#6366f1"/>
                    <stop offset="50%" style="stop-color:#8b5cf6"/>
                    <stop offset="100%" style="stop-color:#ec4899"/>
                </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
            <text x="256" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="180" font-weight="bold" fill="#fff">/ə/</text>
        </svg>`;

        function generateIcon(size) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const img = new Image();
                const svgBlob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                img.onload = () => {
                    ctx.drawImage(img, 0, 0, size, size);
                    URL.revokeObjectURL(url);
                    resolve(canvas);
                };
                img.src = url;
            });
        }

        async function downloadIcon(size) {
            const canvas = await generateIcon(size);
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        async function downloadAllIcons() {
            for (const size of sizes) {
                await downloadIcon(size);
                await new Promise(r => setTimeout(r, 300)); // Delay between downloads
            }
        }

        // Create buttons
        const downloadAllBtn = document.createElement('button');
        downloadAllBtn.textContent = '📦 Download All Icons';
        downloadAllBtn.onclick = downloadAllIcons;
        downloadAllBtn.style.background = 'linear-gradient(135deg, #10b981, #06b6d4)';
        buttonsContainer.appendChild(downloadAllBtn);

        sizes.forEach(size => {
            const btn = document.createElement('button');
            btn.textContent = `${size}x${size}`;
            btn.onclick = () => downloadIcon(size);
            buttonsContainer.appendChild(btn);
        });

        // Show preview
        async function showPreviews() {
            for (const size of sizes) {
                const canvas = await generateIcon(size);
                const div = document.createElement('div');
                div.className = 'icon-item';
                div.innerHTML = `<p>${size}x${size}</p>`;
                
                // Scale down for display
                const displaySize = Math.min(size, 150);
                canvas.style.width = displaySize + 'px';
                canvas.style.height = displaySize + 'px';
                
                div.appendChild(canvas);
                iconGrid.appendChild(div);
            }
        }
        showPreviews();
    </script>
</body>
</html>
