<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  
  <!-- Shine overlay -->
  <ellipse cx="180" cy="150" rx="120" ry="80" fill="url(#shine)"/>
  
  <!-- Book/Dictionary icon -->
  <g transform="translate(256, 256)">
    <!-- Book base -->
    <rect x="-90" y="-70" width="180" height="140" rx="10" fill="#fff" opacity="0.95"/>
    <rect x="-85" y="-65" width="170" height="130" rx="8" fill="#0f0f23" opacity="0.1"/>
    
    <!-- Book spine -->
    <rect x="-90" y="-70" width="20" height="140" rx="5" fill="#fff" opacity="0.8"/>
    
    <!-- IPA Symbol -->
    <text x="0" y="15" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#6366f1">/ə/</text>
    
    <!-- Sound waves -->
    <g stroke="#ec4899" stroke-width="4" fill="none" opacity="0.8">
      <path d="M 95 -20 Q 115 0 95 20" stroke-linecap="round"/>
      <path d="M 110 -35 Q 140 0 110 35" stroke-linecap="round"/>
      <path d="M 125 -50 Q 165 0 125 50" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="120" cy="400" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="400" cy="120" r="6" fill="#fff" opacity="0.4"/>
  <circle cx="380" cy="380" r="10" fill="#fff" opacity="0.3"/>
</svg>
